delivery:
  signature: Standard Webhooks specification – each delivery includes `webhook-id`, `webhook-timestamp`, and `webhook-signature` headers. Verification
    uses the secret (`whsec_` prefix) you provide.
  retries: Failed deliveries are retried up to **10 times** with exponential backoff (base 2, starting at 30 seconds).
